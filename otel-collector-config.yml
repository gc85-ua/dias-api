receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  
  redis:
    endpoint: "cache:6379"
    collection_interval: 10s

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespaces:
      metrics: "otelcol"
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp, redis]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs,debug]
