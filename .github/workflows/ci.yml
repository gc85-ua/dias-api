name: Run reusable CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "dockerfile"
      - "uv.lock"
      - ".python-version"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      image-name: dias-api
      dockerfile-path: ./dockerfile
